# ローカルの公開ポートは全て .env の変数で指定できる（複数プロジェクト同時起動時の
# ポート競合を避けるため）。デフォルト値は他 QOL アプリと衝突しない値にしてある。
#   BACKEND_PORT (default 19000) / FRONTEND_PORT (9999)
# DB は本番同様 SQLite に統一（backend/db.sqlite3 に永続化。別途 DB コンテナ不要）。
services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: skill-backend
    ports:
      - "${BACKEND_PORT:-19000}:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: skill-frontend
    ports:
      - "${FRONTEND_PORT:-9999}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      # フロントからバックエンドを叩く URL（ホスト側ポートに合わせる）
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:19000}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
